[workspace]
members = ["libsruman", "sruman"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/Gigas002/sruman"
description = "Steam Linux Runtime manager: install and update runtimes, run native games in them through profiles and prefixes"
keywords = ["steam", "runtime", "linux", "games", "pressure-vessel"]
repository = "https://github.com/Gigas002/sruman"
version = "0.1.0"

[workspace.dependencies]
# xz: pure Rust, with a multithreaded block decoder (Valve's archives are
# multi-block: ~1.1 s vs ~9 s single-threaded for sniper); no C build.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
libsruman = { path = "libsruman", version = "0.1.0", default-features = false }
# gzip for runtime file lists (mtree.txt.gz); pure-Rust miniz_oxide backend
flate2 = "1"
# Whole-file OFD/POSIX lock probes (pressure-vessel's in-use protocol)
# tar parsing only; sruman writes every entry itself (see install::extract).
tar = { version = "0.4", default-features = false }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
# SHA-256 for -Qkk (mtree digests) and archive checks
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
# HTTP for the default `Fetch`; rustls on ring (no AWS-LC C build), bundled
# webpki roots, no gzip (archives are fetched byte-exact, with Range).
ureq = { version = "3", default-features = false, features = ["rustls"] }
