[package]
name = "libsruman-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Its own workspace: nightly-only, never part of the gates.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
libsruman = { path = "../libsruman", features = ["download"] }
tempfile = "3"
toml = "1"

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false
