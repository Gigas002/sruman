# Two profiles can share one prefix: both games see the same home.
# Here a sniper and a soldier profile use ~/.local/share/sruman/prefixes/indie.

name = "shared-prefix-a"
prefix = "~/.local/share/sruman/prefixes/indie"
wrappers = ["gamemoderun"]

[slr]
runtime = "sniper"
filesystems_ro = ["~/Music"]               # e.g. a game that plays your music
