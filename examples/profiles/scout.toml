# ~/.config/sruman/profiles/scout.toml
# Older native games (built for Steam Runtime 1.0, e.g. Hollow Knight) run in
# scout, which runs inside a soldier container: `sruman install scout` installs both.

name = "scout"
runner = "slr"
prefix = "~/.local/share/sruman/prefixes/scout"   # saves and configs go to <prefix>/home

[slr]
runtime = "scout"
# mode = "overlay"                         # no container (no soldier needed): faster,
#                                          # but the prefix only redirects HOME and XDG_*
