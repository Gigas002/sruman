[package]
name = "libsruman"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
repository.workspace = true

[features]
default = ["download", "ureq"]
# Sync index, installs and upgrades through the `Fetch` trait.
download = []
# `UreqFetch`, the default `Fetch`. Callers with their own HTTP client
# (gaki) enable only `download` and implement `Fetch`.
ureq = ["download", "dep:ureq"]

[dependencies]
flate2.workspace = true
rustix.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
