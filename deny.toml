[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    # subtle (rustls)
    "BSD-3-Clause",
    # webpki-roots: the bundled Mozilla root certificates
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    # ring, rustls-webpki
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[bans]
multiple-versions = "warn"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
